[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @kiri/schema build && pnpm --filter @kiri/db build && pnpm --filter @kiri/api build"
# Watch paths: configure per service in Railway (see docs/railway-deploy.md).
# Repo-root watchPatterns here also applied to the web Docker service and caused
# "No changes to watched files" when only apps/web changed.

[deploy]
startCommand = "node apps/api/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
