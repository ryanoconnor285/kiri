name: Kiri
options:
  bundleIdPrefix: app.kiri
  deploymentTarget:
    iOS: "17.0"
  configurations:
    Debug:
      xcconfig: Config/Debug.xcconfig
    Staging:
      xcconfig: Config/Staging.xcconfig
    ReleaseStaging:
      xcconfig: Config/ReleaseStaging.xcconfig
      buildSettings:
        SWIFT_OPTIMIZATION_LEVEL: -O
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: STAGING
    Release:
      buildSettings:
        SWIFT_OPTIMIZATION_LEVEL: -O
targets:
  Kiri:
    type: application
    platform: iOS
    sources:
      - path: Kiri
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.kiri.study
      SWIFT_VERSION: "5.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_CFBundleIconName: AppIcon
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: Kiri/Info.plist
    scheme:
      testTargets: []
      environmentVariables:
        - variable: KIRI_API_URL
          value: http://localhost:4000
          isEnabled: false
